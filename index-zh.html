<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>身体物件 | Body Objects</title>

  <link rel="stylesheet" href="style.css" />

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>
</head>

<body class="zh-site">
  <header class="site-header">
    <div class="brand">BODY OBJECTS</div>

    <nav class="nav">
      <a href="index-zh.html">首页</a>
      <a href="objects-zh.html">作品</a>
      <a href="archive-zh.html">档案</a>
      <a href="process-zh.html">过程</a>
      <a href="about-zh.html">关于</a>
      <a href="contact-zh.html">联系</a>
      <a class="language-link" href="index.html">EN</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="body-grid">
        <div class="body-placeholder">
          <div class="body-placeholder-label">BODY MODEL / INDEX VIEW</div>

          <model-viewer
  class="body-model-viewer"
  src="models/body-wireframe.glb"
  alt="3D wireframe human body model"
  auto-rotate
  rotation-per-second="5deg"
  camera-orbit="0deg 78deg 100m"
  field-of-view="34deg"
  camera-target="0m 10m 0m"
  exposure="1"
  shadow-intensity="0"
  interaction-prompt="none">
</model-viewer>
        </div>
      </div>

      <div class="hero-text">
        <p class="label">OBJECT INDEX / 001</p>

        <h1>以身体为尺度的首饰实验</h1>

        <p class="intro">
          从锁骨、耳部和手势等身体线索出发，建立一组可佩戴的测量物件，
          它们不只是装饰，而是观察、定位和校准身体关系的工具
        </p>

        <div class="hero-links">
          <a href="objects-zh.html">查看作品</a>
          <a href="objects-zh.html">身体索引</a>
        </div>
      </div>
    </section>

    <section class="objects-preview">
      <p class="label">SELECTED OBJECTS</p>

      <div class="object-list">
        <article class="object-card">
          <p>C-01</p>
          <div>
            <h2>锁骨测规</h2>
            <span>线索：锁骨距离</span>
            <span>进度：原型可询</span>
          </div>
        </article>

        <article class="object-card">
          <p>E-01</p>
          <div>
            <h2>耳部坐标</h2>
            <span>线索：耳廓边界</span>
            <span>进度：档案研究</span>
          </div>
        </article>

        <article class="object-card">
          <p>H-01</p>
          <div>
            <h2>手势限度</h2>
            <span>线索：手部动作</span>
            <span>进度：发展中</span>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
