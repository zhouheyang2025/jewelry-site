<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>格物</title>
  <link rel="stylesheet" href="style.css?v=refinement-20260430" />
</head>

<body class="home-page zh-site">
  <header class="site-header">
    <a class="brand" href="index-zh.html" aria-current="page">首饰</a>

    <nav class="nav" aria-label="主导航">
      <a href="index-zh.html">格物</a>
      <a href="contact-zh.html">信息</a>
      <a href="https://zhouheyang2025.github.io/" target="_blank" rel="noopener">艺术家作品集</a>
      <a class="language-link" href="index.html">EN</a>
    </nav>
  </header>

  <main>
    <section class="home-index home-index--interactive home-index--compact" aria-label="首饰索引" data-index-browser data-preview-mode="adaptive">
      <section class="index-browser home-browser" aria-labelledby="home-objects-title">
        <div>
          <div class="browser-heading">
            <h2 id="home-objects-title">物件索引</h2>
          </div>

          <div class="index-table-head" aria-hidden="true">
            <span>编号</span>
            <span>名称</span>
            <span>年份</span>
            <span>材料</span>
            <span>类型</span>
            <span>进度</span>
          </div>

          <ol class="index-list">
            <li id="c-01">
              <button class="index-row" type="button" data-preview-key="c01" aria-controls="home-preview" aria-pressed="false">
                <span class="row-thumb media-clavicle"><span>C-01</span></span>
                <span class="row-code">C-01</span>
                <span class="row-title">锁骨测规</span>
                <span class="row-year">待定</span>
                <span class="row-material">不锈钢 / 银 / 钢缆</span>
                <span class="row-type">项链物件</span>
                <span class="row-status">原型</span>
              </button>
            </li>

            <li id="e-01">
              <button class="index-row" type="button" data-preview-key="e01" aria-controls="home-preview" aria-pressed="false">
                <span class="row-thumb media-ear"><span>E-01</span></span>
                <span class="row-code">E-01</span>
                <span class="row-title">耳部坐标</span>
                <span class="row-year">待定</span>
                <span class="row-material">金属框架 / 测试材料</span>
                <span class="row-type">耳部物件</span>
                <span class="row-status">档案</span>
              </button>
            </li>

            <li id="h-01">
              <button class="index-row" type="button" data-preview-key="h01" aria-controls="home-preview" aria-pressed="false">
                <span class="row-thumb media-hand"><span>H-01</span></span>
                <span class="row-code">H-01</span>
                <span class="row-title">手部测量物</span>
                <span class="row-year">待定</span>
                <span class="row-material">银 / 不锈钢 / 钢缆</span>
                <span class="row-type">手部物件</span>
                <span class="row-status">进行中</span>
              </button>
            </li>
          </ol>
        </div>
      </section>

      <aside class="index-preview home-preview" id="home-preview" data-preview-stage aria-hidden="true">
        <div class="preview-stage">
          <article class="preview-card" data-preview-card="c01">
            <div class="preview-media media-clavicle" role="img" aria-label="C-01 锁骨测规预览图"><span aria-hidden="true"></span></div>
            <p class="preview-caption">以锁骨线为尺度的身体研究。</p>
          </article>

          <article class="preview-card" data-preview-card="e01">
            <div class="preview-media media-ear" role="img" aria-label="E-01 耳部坐标预览图"><span aria-hidden="true"></span></div>
            <p class="preview-caption">围绕耳部位置展开的坐标研究。</p>
          </article>

          <article class="preview-card" data-preview-card="h01">
            <div class="preview-media media-hand" role="img" aria-label="H-01 手部测量物预览图"><span aria-hidden="true"></span></div>
            <p class="preview-caption">用于记录手部位置的测量研究。</p>
          </article>
        </div>
      </aside>

      <div class="home-statement home-statement--compact">
        <p>身体、材料与测量的可佩戴记录。</p>
      </div>

    </section>
  </main>

  <script src="script.js?v=refinement-20260430" defer></script>
</body>
</html>
