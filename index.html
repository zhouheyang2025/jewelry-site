<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investigation</title>
  <link rel="stylesheet" href="style.css?v=scan-preview-20260430" />
</head>

<body class="home-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-current="page">Investigation</a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="index.html">Jewelry</a>
      <a href="contact.html">Info</a>
      <a href="https://zhouheyang2025.github.io/" target="_blank" rel="noopener">Artist Portfolio</a>
      <a class="language-link" href="index-zh.html">中文</a>
    </nav>
  </header>

  <main>
    <section class="home-index home-index--interactive home-index--compact" aria-label="Jewelry Index" data-index-browser data-preview-mode="adaptive">
      <section class="index-browser home-browser" aria-labelledby="home-objects-title">
        <div>
          <div class="browser-heading">
            <h2 id="home-objects-title">Object Index</h2>
          </div>

          <div class="index-table-head" aria-hidden="true">
            <span>ID</span>
            <span>Name</span>
            <span>Year</span>
            <span>Material</span>
            <span>Type</span>
            <span>Status</span>
          </div>

          <ol class="index-list">
            <li id="c-01">
              <button class="index-row" type="button" data-preview-key="c01" aria-controls="home-preview" aria-pressed="false">
                <span class="row-thumb media-clavicle"><span>C-01</span></span>
                <span class="row-code">C-01</span>
                <span class="row-title">Clavicle Gauge</span>
                <span class="row-year">TBC</span>
                <span class="row-material">Stainless steel / silver / cable</span>
                <span class="row-type">Necklace object</span>
                <span class="row-status">Prototype</span>
              </button>
            </li>

            <li id="e-01">
              <button class="index-row" type="button" data-preview-key="e01" aria-controls="home-preview" aria-pressed="false">
                <span class="row-thumb media-ear"><span>E-01</span></span>
                <span class="row-code">E-01</span>
                <span class="row-title">Ear Coordinate Study</span>
                <span class="row-year">TBC</span>
                <span class="row-material">Metal frame / test material</span>
                <span class="row-type">Ear object</span>
                <span class="row-status">Archive</span>
              </button>
            </li>

            <li id="h-01">
              <button class="index-row" type="button" data-preview-key="h01" aria-controls="home-preview" aria-pressed="false">
                <span class="row-thumb media-hand"><span>H-01</span></span>
                <span class="row-code">H-01</span>
                <span class="row-title">Hand Measuring Object</span>
                <span class="row-year">TBC</span>
                <span class="row-material">Silver / stainless steel / cable</span>
                <span class="row-type">Hand object</span>
                <span class="row-status">In progress</span>
              </button>
            </li>
          </ol>
        </div>
      </section>

      <aside class="index-preview home-preview" id="home-preview" data-preview-stage aria-hidden="true">
        <div class="preview-stage">
          <article class="preview-card" data-preview-card="c01">
            <div class="preview-media media-clavicle" role="img" aria-label="Preview diagram for C-01 Clavicle Gauge"><span aria-hidden="true"></span></div>
            <p class="preview-caption">A body-scale study for the clavicle line.</p>
          </article>

          <article class="preview-card" data-preview-card="e01">
            <div class="preview-media media-ear" role="img" aria-label="Preview diagram for E-01 Ear Coordinate Study"><span aria-hidden="true"></span></div>
            <p class="preview-caption">A coordinate study around the ear.</p>
          </article>

          <article class="preview-card" data-preview-card="h01">
            <div class="preview-media media-hand" role="img" aria-label="Preview diagram for H-01 Hand Measuring Object"><span aria-hidden="true"></span></div>
            <p class="preview-caption">A measuring study for hand position.</p>
          </article>
        </div>
      </aside>

      <div class="home-statement home-statement--compact">
        <p>Wearable records of body, material, and measurement.</p>
      </div>

    </section>
  </main>

  <script src="script.js?v=scan-preview-20260430" defer></script>
</body>
</html>
